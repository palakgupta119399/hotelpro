<article class="room"><div class="room-art">{{ room.emoji }}</div><div class="room-body"><div class="row"><h3>{{ room.name }}</h3><span class="pill">{{ room.room_type }}</span></div><p class="muted">{{ room.description }}</p><div class="meta"><span>👤 Up to {{ room.capacity }} guests</span><span>★ 4.8 rating</span></div><div class="row"><div class="price">₹{{ "{:,}".format(room.price) }} <small>/ night</small></div><a class="btn primary" href="{{ url_for('book',room_id=room.id) }}">Book now</a></div></div></article>
